# Fly.io - securemail
# URL: https://securemail.fly.dev/painel/

app = "securemail"
primary_region = "gru"

[build]
  dockerfile = "webmail-unified/Dockerfile"
  build-context = "."

[env]
  PORT = "8080"
  FLY_APP_NAME = "securemail"
  APP_BASE_URL = "https://securemail.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health.php"
    timeout = "10s"

[[mounts]]
  source = "security_webmail_data"
  destination = "/data"
  initial_size = "2gb"

[[vm]]
  memory = "4096mb"
  cpu_kind = "shared"
  cpus = 2
