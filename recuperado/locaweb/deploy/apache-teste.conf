# http://IP/teste/  e  http://IP/teste/panel/login.php
# ORDEM IMPORTA: alias mais longo (/teste/panel) ANTES de /teste

Alias /teste/panel /var/www/html/teste/panel

<Directory /var/www/html/teste/panel>
    DirectoryIndex login.php
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

RedirectMatch 301 ^/teste/panel$ /teste/panel/login.php

Alias /teste /var/www/html/teste/public

<Directory /var/www/html/teste/public>
    DirectoryIndex index.php
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/teste/(var|includes|src|deploy)">
    Require all denied
</DirectoryMatch>
