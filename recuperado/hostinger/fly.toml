# Fly.io — webmail-hostinger
# URL: https://webmail-hostinger.fly.dev/
# Painel: https://webmail-hostinger.fly.dev/panel/

app = 'webmail-hostinger'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  FLY_APP_NAME = 'webmail-hostinger'
  APP_BASE_URL = 'https://webmail-hostinger.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health.php'
    timeout = '10s'

[[mounts]]
  source = 'webmail_hostinger_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
