<VirtualHost *:8080>
    ServerName webmail-cpanel.fly.dev
    DocumentRoot /app

    <Directory /app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    Alias /panel /app/consolelima
    <Directory /app/consolelima>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php login.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
